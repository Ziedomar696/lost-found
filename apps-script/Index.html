<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><base target="_top">
<style>
:root{--bg:#F2F5F4;--card:#fff;--ink:#14201E;--muted:#5A6A67;--line:#D7E0DD;--acc:#0B6B66;--acc2:#D6EBE8;--ok:#2C7A4B;--okb:#DCEFE3;--warn:#9C5B00;--warnb:#F7E6CC;--crit:#B0261E;--critb:#F6DAD7;--tag:#F1D488}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "Segoe UI",Tahoma,Arial,sans-serif}
header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top{display:flex;align-items:center;gap:10px;padding:10px 16px 0;flex-wrap:wrap}.top h1{font-size:18px;margin:0;color:var(--acc)}.who{margin-inline-start:auto;color:var(--muted);font-size:12px}
nav{display:flex;flex-wrap:wrap;gap:2px;padding:0 10px}nav button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;font-family:inherit;font-weight:600;font-size:14px;color:var(--muted);cursor:pointer}
nav button.on{color:var(--acc);border-bottom-color:var(--acc)}
main{padding:16px;max-width:1100px;margin:0 auto;display:grid;gap:14px}main>*,.card,.fld,.filters>*{min-width:0}body{overflow-x:hidden}input[type=date],input[type=time]{min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
h2{font-size:17px;margin:0 0 10px}.sub{color:var(--muted);font-size:13px;margin:-6px 0 10px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.kpi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px}.kpi b{display:block;font-size:26px;color:var(--acc)}.kpi.c b{color:var(--crit)}.kpi span{color:var(--muted);font-size:13px}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:10px 14px}.fld{display:grid;gap:4px}.wide{grid-column:1/-1}
label{font-size:13px;font-weight:600}input,select,textarea{font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:8px;width:100%;background:#fff}textarea{min-height:64px}
.btn{font-family:inherit;font-weight:600;font-size:14px;padding:9px 16px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer}.btn.p{background:var(--acc);border-color:var(--acc);color:#fff}.btn.d{color:var(--crit);border-color:var(--crit)}.btn:disabled{opacity:.5}
.btns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row{display:flex;gap:10px;align-items:center;padding:10px 6px;border-top:1px solid var(--line);cursor:pointer}.row:first-child{border-top:0}.row:hover{background:var(--bg)}
.row .m{flex:1;min-width:0}.row .d{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row .s{color:var(--muted);font-size:12px}
.tag{background:var(--tag);border-radius:4px 10px 10px 4px;padding:1px 9px;font:600 12px Consolas,monospace;direction:ltr;white-space:nowrap}
.pill{font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap;background:var(--acc2);color:var(--acc)}
.pill.ok{background:var(--okb);color:var(--ok)}.pill.w{background:var(--warnb);color:var(--warn)}.pill.c{background:var(--critb);color:var(--crit)}.pill.g{background:#E4E9E8;color:var(--muted)}
.note{padding:10px 12px;border-radius:8px;background:var(--warnb);color:var(--warn);font-size:13.5px}.note.e{background:var(--critb);color:var(--crit);font-weight:600}.note.i{background:var(--acc2);color:var(--acc)}
.filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr;gap:8px;margin-bottom:10px}@media(max-width:700px){.filters{grid-template-columns:1fr 1fr}.filters .q{grid-column:1/-1}}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:4px 12px;font-family:inherit;font-weight:600;font-size:13px;color:var(--muted);cursor:pointer}.chip.on{background:var(--ink);color:#fff}
dl{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:4px 14px;margin:0}dt{color:var(--muted)}dd{margin:0;overflow-wrap:anywhere}
#modal{position:fixed;inset:0;background:rgba(5,15,14,.5);display:none;align-items:flex-start;justify-content:center;padding:20px 10px;overflow:auto;z-index:20}
#modal .box{background:#fff;border-radius:12px;max-width:720px;width:100%;min-width:0;overflow:hidden;padding:18px;display:grid;gap:12px}
.sec{border-top:1px solid var(--line);padding-top:12px;display:grid;gap:10px}
.sig{width:100%;height:160px;border:1.5px dashed var(--line);border-radius:8px;touch-action:none;background:#fff}
.checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));gap:6px}.checks label{font-weight:500;display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.checks input{width:auto}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;display:none;z-index:30;max-width:90%}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{border-bottom:1px solid var(--line);padding:6px;text-align:right}th{color:var(--muted);font-size:12.5px}
.big{font-size:28px;font-weight:700;color:var(--acc)}a{color:var(--acc)}
</style></head><body>
<header><div class="top"><h1>مخزن مفقودات مراسي</h1><span class="who" id="who"></span><span id="acct" class="btns" style="gap:6px"></span></div><nav id="nav"></nav></header>
<main id="app"><div class="card">جاري التحميل…</div></main>
<div id="modal"><div class="box" id="mbox"></div></div><div id="toast"></div>
<script>
var D=null, view="", F={q:"",st:"all",cat:"",from:"",to:""};
var TABS={dash:"لوحة المتابعة",reg:"تسجيل مفقود",store:"المخزن والبحث",permits:"أذونات الخروج",reports:"بلاغات الفقد",cr:"الكنترول روم",users:"الحسابات",lists:"القوائم"};
var ROLE_TABS={admin:["dash","reg","store","permits","reports","cr","users","lists"],keeper:["dash","reg","store","permits","reports"],supervisor:["reg","store"],cr:["cr"]};
var STORED=["في المخزن"];
function $(s){return document.querySelector(s)}
function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function fd(s){if(!s)return "—";var p=String(s).split("T"),d=p[0].split("-");return d[2]+"/"+d[1]+"/"+d[0]+(p[1]?" "+p[1]:"")}
function toast(t){var e=$("#toast");e.textContent=t;e.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(function(){e.style.display="none"},3000)}
var TOKEN="";try{TOKEN=localStorage.getItem("mf_token")||""}catch(e){}
function setToken(t){TOKEN=t||"";try{t?localStorage.setItem("mf_token",t):localStorage.removeItem("mf_token")}catch(e){}}
function raw(fn,args,ok,btn){if(btn)btn.disabled=true;var r=google.script.run.withSuccessHandler(function(x){if(btn)btn.disabled=false;ok&&ok(x)}).withFailureHandler(function(e){if(btn)btn.disabled=false;var m=e.message||String(e);if(m.indexOf("AUTH:")>=0){setToken("");D=null;closeM();toast(m.replace(/^.*AUTH:\s*/,""));showLogin();return}toast(m)});try{r[fn].apply(r,args||[])}catch(e){if(btn)btn.disabled=false;toast("خطأ: "+(e.message||e))}}
function call(fn,args,ok,btn){raw(fn,[TOKEN].concat(args||[]),ok,btn)}
function reload(cb){if(!TOKEN)return start();call("boot",[],function(x){D=x;render();cb&&cb()})}
function opts(arr,sel,ph){return (ph?'<option value="">'+ph+'</option>':"")+arr.map(function(v){return '<option'+(v===sel?" selected":"")+'>'+esc(v)+'</option>'}).join("")}
function pillCls(s){if(/تم التسليم|ساري|في المهلة/.test(s))return "ok";if(/متأخر|مرفوض|منتهي/.test(s))return "c";if(/منتظر|باقي/.test(s))return "w";if(/سُلّم|اتستخدم/.test(s))return "g";return ""}
function pill(s){return '<span class="pill '+pillCls(s)+'">'+esc(s)+'</span>'}
function val(id){var e=document.getElementById(id);return e?String(e.value||"").trim():""}
function go(v){view=v;render();window.scrollTo(0,0)}

function render(){
  var tabs=ROLE_TABS[D.me.role]||[];
  if(tabs.indexOf(view)<0)view=tabs[0];
  $("#acct").innerHTML='<button class="btn" style="padding:4px 10px;font-size:12px" onclick="pwForm()">كلمة السر</button><button class="btn" style="padding:4px 10px;font-size:12px" onclick="doLogout()">خروج</button>';
  $("#who").textContent=(D.me.name||D.me.user)+" · "+({admin:"الإدارة",keeper:"أمين المخزن",supervisor:"مشرف",cr:"الكنترول روم"}[D.me.role]);
  $("#nav").innerHTML=tabs.map(function(t){return '<button class="'+(t===view?"on":"")+'" onclick="go(\''+t+'\')">'+TABS[t]+badge(t)+'</button>'}).join("");
  ({dash:rDash,reg:rReg,store:rStore,permits:rPermits,reports:rReports,cr:rCR,users:rUsers,lists:rLists})[view]();
}
function badge(t){var n=0;
  if(t==="permits"&&D.permits)n=D.permits.filter(function(p){return D.me.role==="admin"?p.status==="منتظر موافقة الإدارة":p.status==="ساري"}).length;
  if(t==="cr")n=D.cr.filter(function(c){return !c.replied}).length;
  if(t==="store"&&D.me.role==="admin")n=D.items.filter(function(i){return i.status==="منتظر تأكيد الإدارة"}).length;
  return n?' <span class="pill c">'+n+'</span>':""}

/* ---------- لوحة المتابعة ---------- */
function rDash(){
  var it=D.items, cnt=function(f){return it.filter(f).length};
  var from=F.dfrom||D.today.slice(0,8)+"01", to=F.dto||D.today;
  var inR=it.filter(function(i){return i.found>=from&&i.found<=to});
  var byCat={};D.lists.cats.forEach(function(c){byCat[c.name]={t:0,s:0,o:0,d:0,x:0}});
  inR.forEach(function(i){var b=byCat[i.cat]||(byCat[i.cat]={t:0,s:0,o:0,d:0,x:0});b.t++;if(i.status==="في المخزن")b.s++;if(i.status==="تم التسليم")b.d++;if(i.status==="سُلّم لجهة أخرى")b.x++});
  var rows=Object.keys(byCat).filter(function(k){return byCat[k].t}).map(function(k){var b=byCat[k];return "<tr><td>"+esc(k)+"</td><td>"+b.t+"</td><td>"+b.s+"</td><td>"+b.d+"</td><td>"+b.x+"</td></tr>"}).join("");
  var pend=D.permits.filter(function(p){return p.status==="منتظر موافقة الإدارة"}).length;
  var late=D.cr.filter(function(c){return !c.replied&&slaLeft(c)<0}).length;
  $("#app").innerHTML=
   '<div class="kpis">'+
   k(cnt(function(i){return STORED.indexOf(i.status)>=0}),"في المخزن الآن")+
   k(cnt(function(i){return i.status==="منتظر تأكيد الإدارة"}),"منتظر تأكيد الإدارة",1)+
   k(cnt(function(i){return i.found===D.today}),"استلام النهارده")+
   k(D.deliveries.filter(function(d){return d.at.slice(0,10)===D.today}).length,"تسليم النهارده")+
   k(pend,"أذونات منتظرة",1)+
   k(D.reports.filter(function(r){return r.status==="مفتوح"}).length,"بلاغات مفتوحة")+
   k(late,"الكنترول روم متأخر",1)+'</div>'+
   '<div class="card"><h2>حصر حسب النوع</h2><div class="btns" style="margin-bottom:10px"><label>من</label><input type="date" id="dfrom" value="'+from+'" style="width:auto"><label>إلى</label><input type="date" id="dto" value="'+to+'" style="width:auto"><button class="btn p" onclick="F.dfrom=val(\'dfrom\');F.dto=val(\'dto\');rDash()">اعرض</button></div>'+
   (rows?'<table><tr><th>النوع</th><th>المستلم</th><th>في المخزن</th><th>اتسلّم</th><th>لجهة أخرى</th></tr>'+rows+'<tr style="font-weight:700"><td>الإجمالي</td><td>'+inR.length+'</td><td colspan="4"></td></tr></table>':'<p class="sub">مفيش مفقودات في الفترة دي.</p>')+'</div>';
  function k(n,t,c){return '<div class="kpi'+(c&&n?" c":"")+'"><b>'+n+'</b><span>'+t+'</span></div>'}
}

/* ---------- تسجيل مفقود ---------- */
function rReg(){
  var L=D.lists, sup=D.me.role==="supervisor", adm=D.me.role==="admin";
  $("#app").innerHTML='<div class="card"><h2>تسجيل مفقود</h2><p class="sub">'+(adm?"تسجيلك بيدخل المخزن على طول.":"المفقود بيروح للإدارة للتأكيد، وبعدها ياخد رقم ويدخل المخزن.")+'</p>'+
  '<div class="f">'+
  fld("النوع",'<select id="r_cat">'+opts(L.cats.map(function(c){return c.name}))+'</select>')+
  fld("الوصف",'<input id="r_desc" placeholder="مثال: آيفون 14 أسود بجراب شفاف">')+
  fld("اللون / الماركة",'<input id="r_brand">')+
  fld("تاريخ العثور",'<input type="date" id="r_found" value="'+D.today+'" max="'+D.today+'">')+
  fld("الوقت",'<input type="time" id="r_time" value="'+D.now.slice(11,16)+'">')+
  fld("مكان العثور",'<select id="r_loc">'+opts(L.locs)+'</select>')+
  fld("تفاصيل المكان",'<input id="r_locd">')+
  fld("المشرف اللي سلّمه",'<input id="r_sup">')+
  fld("القطاع",'<input id="r_sector">')+
  fld("اللي لقاه",'<input id="r_finder">')+
  (sup?"":fld("مكان التخزين",'<select id="r_store">'+opts(L.stores)+'</select>'))+
  fld("صورة المفقود",'<input type="file" id="r_photo" accept="image/*" capture="environment">')+
  '<div class="fld wide">'+'<label>ملاحظات</label><textarea id="r_notes"></textarea></div>'+
  '<div class="wide btns"><button class="btn p" id="r_go">حفظ</button><span class="sub" id="r_msg"></span></div></div></div>';
  var syncCat=function(){var c=D.lists.cats.filter(function(x){return x.name===val("r_cat")})[0];if(c&&c.valuable&&$("#r_store")){var s=D.lists.stores.filter(function(x){return x.indexOf("خزنة")>=0})[0];if(s)$("#r_store").value=s}};
  $("#r_cat").onchange=syncCat;syncCat();
  $("#r_go").onclick=function(){var b=this;
    if(!val("r_desc"))return toast("اكتب وصف المفقود");
    img("r_photo",function(photo){
      call("saveItem",[{cat:val("r_cat"),desc:val("r_desc"),brand:val("r_brand"),found:val("r_found"),time:val("r_time"),loc:val("r_loc"),locd:val("r_locd"),sup:val("r_sup"),sector:val("r_sector"),finder:val("r_finder"),store:val("r_store"),notes:val("r_notes"),photo:photo}],
      function(x){reload(function(){ $("#app").innerHTML='<div class="card" style="text-align:center"><p class="sub">'+(x.confirmed?"اتسجّل ودخل المخزن. اكتب الرقم ده على الكيس:":"اتسجّل واتبعت للإدارة للتأكيد. الرقم:")+'</p><div class="big"><span class="tag" style="font-size:24px">'+esc(x.id)+'</span></div><p></p><div class="btns" style="justify-content:center"><button class="btn p" onclick="go(\'reg\')">سجّل مفقود تاني</button>'+(D.me.role==="supervisor"?"":'<button class="btn" onclick="openItem(\''+x.id+'\')">التفاصيل والملصق</button>')+'</div></div>' })},b)});
  };
}
function fld(l,h){return '<div class="fld"><label>'+l+'</label>'+h+'</div>'}
function img(id,cb){var f=document.getElementById(id);f=f&&f.files&&f.files[0];if(!f)return cb("");
  var r=new FileReader();r.onerror=function(){cb("")};r.onload=function(){var im=new Image();im.onload=function(){var k=Math.min(1,1280/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);cb(c.toDataURL("image/jpeg",.8))};im.onerror=function(){cb("")};im.src=r.result};r.readAsDataURL(f)}

/* ---------- المخزن والبحث ---------- */
function rStore(){
  var it=D.items, q=F.q.toLowerCase();
  var list=it.filter(function(i){
    if(F.st==="stored"&&STORED.indexOf(i.status)<0)return false;
    if(F.st!=="all"&&F.st!=="stored"&&i.status!==F.st)return false;
    if(F.cat&&i.cat!==F.cat)return false;
    if(F.from&&i.found<F.from)return false; if(F.to&&i.found>F.to)return false;
    if(q&&[i.id,i.cat,i.desc,i.brand,i.loc,i.locd,i.store,i.sup,i.notes].join(" ").toLowerCase().indexOf(q)<0)return false;
    return true}).sort(function(a,b){return b.id<a.id?-1:1});
  var chips=[["all","الكل"],["stored","في المخزن"],["منتظر تأكيد الإدارة","منتظر تأكيد"],["تم التسليم","تم التسليم"],["سُلّم لجهة أخرى","لجهة أخرى"]];
  $("#app").innerHTML='<div class="card"><h2>المخزن والبحث</h2>'+
   '<div class="filters"><input class="q" id="s_q" placeholder="رقم المفقود، الوصف، المكان… (أو امسح الباركود)" value="'+esc(F.q)+'"><select id="s_cat">'+opts(D.lists.cats.map(function(c){return c.name}),F.cat,"كل الأنواع")+'</select><input type="date" id="s_from" value="'+F.from+'" title="من"><input type="date" id="s_to" value="'+F.to+'" title="إلى"><button class="btn" onclick="F={q:\'\',st:\'all\',cat:\'\',from:\'\',to:\'\'};rStore()">مسح</button></div>'+
   '<div class="chips">'+chips.map(function(c){return '<button class="chip'+(F.st===c[0]?" on":"")+'" onclick="F.st=\''+c[0]+'\';rStore()">'+c[1]+'</button>'}).join("")+'</div>'+
   '<p class="sub">'+list.length+' نتيجة</p><div>'+list.slice(0,300).map(row).join("")+'</div></div>';
  var t;$("#s_q").oninput=function(){clearTimeout(t);var v=this.value;t=setTimeout(function(){F.q=v;rStore();var e=$("#s_q");e.focus();e.setSelectionRange(v.length,v.length)},300)};
  $("#s_q").onkeydown=function(e){if(e.key==="Enter"){var v=this.value.trim().toUpperCase();if(D.items.some(function(i){return i.id===v})){this.value="";F.q="";openItem(v)}}};
  $("#s_cat").onchange=function(){F.cat=this.value;rStore()};$("#s_from").onchange=function(){F.from=this.value;rStore()};$("#s_to").onchange=function(){F.to=this.value;rStore()};
}
function row(i){return '<div class="row" onclick="openItem(\''+esc(i.id)+'\')"><span class="tag">'+esc(i.id)+'</span><div class="m"><div class="d">'+esc(i.cat)+(i.desc?" · "+esc(i.desc):"")+'</div><div class="s">'+esc(i.loc||"")+" · "+fd(i.found)+(i.store?" · التخزين: "+esc(i.store):"")+'</div></div>'+pill(i.status)+'</div>'}

/* ---------- نافذة المفقود ---------- */
function modal(h){$("#mbox").innerHTML=h;$("#modal").style.display="flex"}
function closeM(){$("#modal").style.display="none"}
$("#modal").onclick=function(e){if(e.target.id==="modal")closeM()};
function permitOf(id){return (D.permits||[]).filter(function(p){return p.item===id&&(p.status==="ساري"||p.status==="منتظر موافقة الإدارة")})[0]}
function openItem(id,mode){
  var i=D.items.filter(function(x){return x.id===id})[0]; if(!i)return toast("المفقود مش موجود");
  if(D.me.role==="supervisor")return modal('<div class="btns"><span class="tag">'+esc(i.id)+'</span>'+pill(i.status)+'<button class="btn" style="margin-inline-start:auto" onclick="closeM()">إغلاق</button></div><dl><dt>النوع</dt><dd>'+esc(i.cat)+'</dd><dt>الوصف</dt><dd>'+esc(i.desc)+'</dd><dt>المكان</dt><dd>'+esc(i.loc)+'</dd><dt>التاريخ</dt><dd>'+fd(i.found)+'</dd></dl>');
  var adm=D.me.role==="admin", p=permitOf(id), stored=STORED.indexOf(i.status)>=0;
  var dl=D.deliveries.filter(function(d){return d.item===id})[0], ot=D.others.filter(function(o){return o.item===id})[0];
  var h='<div class="btns"><span class="tag" style="font-size:16px">'+esc(i.id)+'</span>'+pill(i.status)+(i.valuable?'<span class="pill w">ثمين</span>':'')+'<button class="btn" style="margin-inline-start:auto" onclick="closeM()">إغلاق</button></div>'+
  (i.photo?fileLink(i.photo,"عرض صورة المفقود"):'')+

  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+(x+10)+' 1" preserveAspectRatio="none" shape-rendering="crispEdges" style="width:100%;height:'+hmm+'mm;display:block">'+bars+'</svg>'}

function prioH(n){var p=D.lists.prios.filter(function(x){return x.name===n})[0];return p?p.hours:24}
function slaLeft(c){if(!c.sent)return 1e9;var due=new Date(c.sent).getTime()+prioH(c.prio)*3600e3;return due-Date.now()}
function slaTxt(c){if(c.replied){var due=new Date(c.sent).getTime()+prioH(c.prio)*3600e3;return new Date(c.replied).getTime()>due?"اتردّ متأخر":"اتردّ في المهلة"}
  var l=slaLeft(c),h=Math.abs(l)/3600e3;return (l<0?"متأخر ":"باقي ")+(h<1?Math.round(h*60)+" دقيقة":h.toFixed(1)+" ساعة")}

     (arr.map(function(x,i){return '<div class="row" style="cursor:default"><div class="m"><div class="d">'+esc(x.name)+(x.valuable?' <span class="pill w">ثمين</span>':'')+'</div>'+'</div><button class="btn" onclick="lEdit(\''+k+'\','+i+')">تعديل</button><button class="btn d" onclick="lDel(\''+k+'\','+i+')">مسح</button></div>'}).join("")||'<p class="sub">فاضية.</p>')+'</div>'}).join("");
}

var IMP=null;
function impCard(){return '<div class="card"><h2>استيراد مفقودات من ملف Excel</h2><p class="sub">ملف شيت المفقودات القديم (Auto Code، Found By، Date Found، Status…). المفقود اللي رقمه موجود بيتساب، فتقدر ترفع نفس الملف أو أجزاء جديدة منه أكتر من مرة.</p><input type="file" id="imp_f" accept=".xlsx,.xlsm,.xls,.csv" onchange="impRead(this)"><div id="imp_o" style="margin-top:10px"></div></div>'}
function loadXLSX(cb){if(window.XLSX)return cb();var s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js";s.onload=cb;s.onerror=function(){toast("مش قادر يحمّل قارئ الإكسيل، اتأكد من النت")};document.head.appendChild(s)}
function impRead(inp){var f=inp.files&&inp.files[0];if(!f)return;$("#imp_o").innerHTML='<p class="sub">جاري قراءة الملف…</p>';
  loadXLSX(function(){var r=new FileReader();r.onload=function(){try{var wb=XLSX.read(new Uint8Array(r.result),{type:"array",cellDates:true});var all=[];
    wb.SheetNames.forEach(function(n){all=all.concat(parseLegacy(XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:null})))});impPreview(all)}catch(e){$("#imp_o").innerHTML='<div class="note e">الملف ده مش مقروء: '+esc(e.message)+'</div>'}};r.readAsArrayBuffer(f)})}
function ymd(y,m,d){return y+"-"+("0"+m).slice(-2)+"-"+("0"+d).slice(-2)}
/* التاريخ في الشيت مكتوب يوم-شهر-سنة. الخانات اللي الإكسيل حوّلها لتاريخ بيكون قالب اليوم والشهر، فبنصلّحها،
   ولو مسار الصورة فيه فولدر الشهر\اليوم بنعتمد عليه. */
function legacyDate(v,path){var y=null,m=null,d=null;
  if(v instanceof Date){var t=new Date(v.getTime()+12*3600e3);y=t.getFullYear();m=t.getDate();d=t.getMonth()+1}
  else if(v!=null&&String(v).trim()){var s=String(v).trim(),p=s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})/),q=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
    if(p){d=+p[1];m=+p[2];y=+p[3]}else if(q){y=+q[1];m=+q[2];d=+q[3]}}
  var f=String(path||"").match(/[\\\/](\d{2})[\\\/](\d{2})[\\\/]/);
  if(f&&+f[1]>=1&&+f[1]<=12&&+f[2]>=1&&+f[2]<=31){m=+f[1];d=+f[2]}
  if(!y||!m||!d||m>12||d>31)return "";return ymd(y,m,d)}
function parseLegacy(A){var hi=-1,H=null;
  for(var i=0;i<Math.min(A.length,30);i++){var r=(A[i]||[]).map(function(x){return String(x==null?"":x).trim().toLowerCase()});if(r.indexOf("auto code")>=0){hi=i;H=r;break}}
  if(hi<0)return [];
  var c=function(){for(var k=0;k<arguments.length;k++){var j=H.indexOf(arguments[k]);if(j>=0)return j}return -1};
  var C={code:c("auto code"),by:c("found by"),date:c("date found"),st:c("status"),cat:c("category"),photo:c("photo url"),desc:c("description"),loc:c("village loc.","village loc"),qty:c("unit/store"),dd:c("delivere date","delivered date"),rb:c("received by")};
  var g=function(r,k){return C[k]<0?null:r[C[k]]},sv=function(v){return v==null?"":String(v).trim()};
  return A.slice(hi+1).filter(function(r){return r&&sv(g(r,"code"))}).map(function(r){
    var photo=sv(g(r,"photo")),rb=sv(g(r,"rb")),st=sv(g(r,"st")).toLowerCase(),parts=rb.split(/\s+-\s+/);
    var short=photo.replace(/^.*?[\\\/](photo[\\\/])/i,"$1");
    var dd=g(r,"dd");
    return {code:sv(g(r,"code")).replace(/\.0$/,""),by:sv(g(r,"by")),found:legacyDate(g(r,"date"),photo),cat:sv(g(r,"cat")),desc:sv(g(r,"desc")),loc:sv(g(r,"loc")),
      qty:sv(g(r,"qty")),photoPath:short,delivered:st==="delivered"||!!rb,delivDate:dd==null||dd===""?"":legacyDate(dd,""),recRaw:rb,recUnit:parts.length>1?parts[0]:"",recName:parts.length>1?parts.slice(1).join(" - "):rb}})}
function impPreview(rows){IMP=rows;var o=$("#imp_o");
  if(!rows.length){o.innerHTML='<div class="note e">مش لاقي صف عناوين فيه «Auto Code» في الملف.</div>';return}
  var have={};D.items.forEach(function(i){have[i.id]=1});
  var nw=rows.filter(function(r){return !have[r.code]}),bad=nw.filter(function(r){return !r.found}),dl=nw.filter(function(r){return r.delivered});
  o.innerHTML='<div class="note i">في الملف '+rows.length+' مفقود: <b>'+nw.length+' جديد</b>'+(rows.length-nw.length?' و'+(rows.length-nw.length)+' موجود قبل كده (هيتساب)':'')+'، منهم '+dl.length+' متسلّم.'+(bad.length?' <b>'+bad.length+' من غير تاريخ مقروء</b> (هيتسجّلوا من غير تاريخ عثور).':'')+'</div>'+
   '<div style="overflow-x:auto;margin-top:8px"><table><tr><th>الرقم</th><th>التاريخ</th><th>النوع</th><th>الوصف</th><th>المكان</th><th>لقاه</th><th>الحالة</th></tr>'+
   nw.slice(0,15).map(function(r){return '<tr><td>'+esc(r.code)+'</td><td>'+(r.found?fd(r.found):'<b style="color:var(--crit)">؟</b>')+'</td><td>'+esc(r.cat)+'</td><td>'+esc(r.desc)+'</td><td>'+esc(r.loc)+'</td><td>'+esc(r.by)+'</td><td>'+(r.delivered?'متسلّم'+(r.recName?' · '+esc(r.recName):''):'في المخزن')+'</td></tr>'}).join("")+'</table></div>'+
   (nw.length>15?'<p class="sub">وكمان '+(nw.length-15)+'…</p>':'')+
   '<p class="sub">الصور اللي في الشيت متخزنة على جهاز المكتب، فمش هتتنقل. مسار كل صورة هيتكتب في ملاحظات المفقود. الأنواع والأماكن الجديدة هتتضاف للقوائم، وتقدر تغيّر أسماءها بالعربي بعد كده من هنا.</p>'+
   (nw.length?'<div class="btns"><button class="btn p" id="imp_go">استيراد '+nw.length+' مفقود</button><span class="sub" id="imp_msg"></span></div>':'');
  if(nw.length)$("#imp_go").onclick=function(){impSend(nw,this)}}
function impSend(rows,b){var i=0,tot={items:0,deliv:0,skipped:0,cats:0,locs:0},t0=Date.now(),N=1500;b.disabled=true;
  var sec=function(){return Math.round((Date.now()-t0)/1000)};
  var next=function(){
    if(i>=rows.length){
      // النتيجة بتظهر على طول، وتحديث البيانات بيحصل في الخلفية
      $("#imp_o").innerHTML='<div class="note i">اتنقل '+tot.items+' مفقود في '+sec()+' ثانية، منهم '+tot.deliv+' متسلّم'+(tot.cats||tot.locs?'، واتضاف '+tot.cats+' نوع و'+tot.locs+' مكان للقوائم':'')+(tot.skipped?'. اتساب '+tot.skipped+' موجود قبل كده':'')+'.</div>';
      toast("خلص النقل");call("boot",[],function(x){D=x});return}
    var left=i?Math.round(sec()/i*(rows.length-i)):0;
    $("#imp_msg").textContent="جاري النقل… "+Math.round(i*100/rows.length)+"% ("+i+" من "+rows.length+")"+(left?" · فاضل حوالي "+left+" ثانية":"");
    call("importLegacy",[rows.slice(i,i+N)],function(r){["items","deliv","skipped","cats","locs"].forEach(function(k){tot[k]+=r[k]});i+=N;next()},b)};
  next()}
function lEdit(k,i){var L=LISTS_UI.filter(function(x){return x[0]===k})[0],x=i>=0?listItems(k)[i]:{name:"",valuable:false};
  modal('<h3 style="margin:0">'+(i>=0?"تعديل":"إضافة")+' · '+L[1]+'</h3><div class="f">'+fld(L[2],'<input id="le_name" value="'+esc(x.name)+'">')+

   (i>=0&&k!=="staff"&&k!=="parties"?'<p class="sub" style="margin:0">لو غيّرت الاسم، المفقودات'+(k==="stores"?"":" والبلاغات")+' القديمة هتتحدّث بالاسم الجديد.</p>':'')+
   '<div class="btns"><button class="btn p" id="le_go">حفظ</button><button class="btn" onclick="closeM()">إلغاء</button></div>');
  $("#le_name").focus();
  $("#le_go").onclick=function(){call("listSave",[k,i>=0?x.name:"",{name:val("le_name"),valuable:k==="cats"&&$("#le_val").checked}],function(r){closeM();toast(r&&r.renamed?"اتحفظ واتحدّث "+r.renamed+" سجل قديم":"اتحفظ");reload()},this)}}
function lDel(k,i){var x=listItems(k)[i];confirmM("مسح «"+esc(x.name)+"» من القايمة؟ المفقودات القديمة هتفضل بالاسم ده.","مسح",function(b){call("listDelete",[k,x.name],function(){closeM();toast("اتمسح");reload()},b)})}
